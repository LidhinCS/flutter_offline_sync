name: flutter_offline_sync_push
description: >
  Flutter adapters for flutter_offline_sync_core: Workmanager background sync,
  connectivity-triggered foreground sync, and startup recovery.
version: 0.1.0
resolution: workspace

homepage: https://lidhin.github.io/flutter_offline_sync/
repository: https://github.com/LidhinCS/flutter_offline_sync
issue_tracker: https://github.com/LidhinCS/flutter_offline_sync/issues
documentation: https://lidhin.github.io/flutter_offline_sync/guide/foreground-background

topics:
  - offline
  - sync
  - workmanager
  - connectivity
  - flutter

environment:
  sdk: ^3.12.2
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_offline_sync_core: ^0.1.0
  connectivity_plus: ^7.3.1
  workmanager: ^0.10.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift: ^2.34.0
  flutter_lints: ^6.0.0
