name: offline_sync_pull
description: >
  Pull coordinator for offline-first apps: paginated list sync, entity-batch
  detail sync, and Drift-backed checkpoints. Complements offline_sync_core
  (write queue) on the read side.
version: 0.1.0
resolution: workspace
publisher: lidhin.com
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.0
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.3

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.34.0
  lints: ^6.0.0
  test: ^1.25.7
