name: offline_sync_core
description: >
  Offline-first sync engine for Flutter/Dart apps. Models writes as a DAG of
  Jobs and Steps so that dependent API calls (e.g. upload image -> use its
  URL in a follow-up request) can be queued offline, executed in order when
  connectivity returns, retried partially on failure, and paused on conflict.
version: 0.1.0
resolution: workspace
publisher: lidhin.com

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.0
  sqlite3: ^3.5.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  meta: ^1.15.0

dev_dependencies:
  drift_dev: ^2.34.0
  build_runner: ^2.4.11
  test: ^1.25.7
  lints: ^6.0.0
