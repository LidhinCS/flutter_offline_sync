name: flutter_offline_sync_core
description: >
  Offline-first write queue for Flutter/Dart: jobs and steps with ordered
  dependent API calls, partial retry, and conflict pause.
version: 0.1.2
resolution: workspace

homepage: https://lidhincs.github.io/flutter_offline_sync/
repository: https://github.com/LidhinCS/flutter_offline_sync
issue_tracker: https://github.com/LidhinCS/flutter_offline_sync/issues
documentation: https://lidhincs.github.io/flutter_offline_sync/guide/push

topics:
  - offline
  - sync
  - drift
  - outbox
  - flutter

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.35.3
  sqlite3: ^3.5.0
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  meta: ^1.15.0

dev_dependencies:
  drift_dev: ^2.35.3
  build_runner: ^2.4.11
  test: ^1.25.7
  lints: ^6.0.0
