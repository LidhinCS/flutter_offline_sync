name: offline_sync_ui
description: >
  Flutter UI widgets for offline_sync_core: job status badges, screen banners,
  and list tiles wired to Drift watch streams.
version: 0.1.0
resolution: workspace
publisher: lidhin.com

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  offline_sync_core:
    path: ../offline_sync_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift: ^2.34.0
  flutter_lints: ^6.0.0
