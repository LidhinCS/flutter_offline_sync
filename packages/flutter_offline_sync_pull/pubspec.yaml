name: flutter_offline_sync_pull
description: >
  Pull coordinator for offline-first apps: paginated list sync, entity-batch
  detail sync, and Drift-backed checkpoints.
version: 0.1.2
resolution: workspace

homepage: https://lidhincs.github.io/flutter_offline_sync/
repository: https://github.com/LidhinCS/flutter_offline_sync
issue_tracker: https://github.com/LidhinCS/flutter_offline_sync/issues
documentation: https://lidhincs.github.io/flutter_offline_sync/guide/pull

topics:
  - offline
  - sync
  - pull
  - drift
  - flutter

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.35.3
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.3

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.35.3
  lints: ^6.0.0
  test: ^1.25.7
